; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv

; Dependencias fijadas del firmware modular activo y de los ensayos históricos
; compilados de forma aislada desde archive/firmware_tests/.
lib_deps =
    ESP32Async/ESPAsyncWebServer @ 3.11.2
    ESP32Async/AsyncTCP @ 3.4.10
    bblanchon/ArduinoJson @ 6.21.5
    adafruit/Adafruit MPU6050 @ 2.2.9

; --- Optimización ---
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ARDUINO_RUNNING_CORE=1
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -Os

[env:pruebas_control_ruta]
extends = env:esp32-s3-devkitc-1
test_build_src = no
test_filter = test_control_ruta

; Ejecuta en el host los cálculos puros de convergencia, sin USB, PWM ni
; inicialización Arduino. La variante anterior conserva la compilación cruzada
; con el toolchain real del ESP32.
[env:pruebas_control_ruta_nativas]
platform = native
test_framework = unity
test_build_src = no
test_filter = test_control_ruta_nativa
