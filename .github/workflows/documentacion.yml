name: Documentación reproducible

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs_markdowns/**"
      - "evidencia/**"
      - "docs/**"
      - "scripts/documentacion/**"
      - ".github/workflows/documentacion.yml"
  pull_request:
    paths:
      - "docs_markdowns/**"
      - "documentacionCompleta/**"
      - "evidencia/**"
      - "scripts/documentacion/**"
      - "src/**"
      - "include/**"
      - "desktop_app/**"
      - "android_app/**"
      - "DIAGRAMA_SISTEMA_GENERAL.md"
      - ".github/workflows/documentacion.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Lista única de videos LFS realmente usados por el portal (ejes_invertidos_2026-09-08.mp4 se omite).
      LFS_INCLUDE: "evidencia/videos/servidor_y_robot_ruta_ortogonal.mp4,evidencia/videos/ruta_ortogonal_y100_y50_x190_xmenos190.mp4,evidencia/videos/RutaOrtogonal_ligero.mp4,evidencia/videos/SistemaControlRemotoTestingMovement_ligero.mp4"
    steps:
      # Se evita descargar todo LFS (ahorra ancho de banda mensual): solo los 4 videos usados.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Calcular clave de caché LFS
        id: lfs-key
        run: |
          HASH=$(git lfs ls-files -l --include="$LFS_INCLUDE" | sort | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restaurar caché de objetos LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs-key.outputs.hash }}

      - name: Descargar solo los videos LFS necesarios
        run: git lfs pull --include="$LFS_INCLUDE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs_markdowns/portal/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Universal Ctags
        run: |
          sudo apt-get update
          sudo apt-get install --yes universal-ctags

      - name: Conservar fecha documental versionada
        run: |
          CATALOG_DATE=$(python -c 'import json; print(json.load(open("docs_markdowns/catalogo_funciones.json", encoding="utf-8"))["generated_at"])')
          echo "CATALOG_GENERATED_AT=$CATALOG_DATE" >> "$GITHUB_ENV"

      - name: Regenerar catálogo y UML
        run: |
          python scripts/documentacion/generar_catalogo.py
          python scripts/documentacion/renderizar_uml.py
          python scripts/documentacion/validar_enlaces.py

      - name: Validar y construir portal para Pages
        working-directory: docs_markdowns/portal
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build

      - name: Informar regeneración documental
        run: |
          if ! git diff --quiet -- docs_markdowns; then
            echo "Las herramientas regeneraron artefactos dependientes de la plataforma; el portal validado se desplegará igualmente."
            git diff --stat -- docs_markdowns
          fi

  deploy-pages:
    needs: verificar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Lista única de videos LFS realmente usados por el portal (ejes_invertidos_2026-09-08.mp4 se omite).
      LFS_INCLUDE: "evidencia/videos/servidor_y_robot_ruta_ortogonal.mp4,evidencia/videos/ruta_ortogonal_y100_y50_x190_xmenos190.mp4,evidencia/videos/RutaOrtogonal_ligero.mp4,evidencia/videos/SistemaControlRemotoTestingMovement_ligero.mp4"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Se evita descargar todo LFS (ahorra ancho de banda mensual): solo los 4 videos usados.
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Calcular clave de caché LFS
        id: lfs-key
        run: |
          HASH=$(git lfs ls-files -l --include="$LFS_INCLUDE" | sort | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Restaurar caché de objetos LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ steps.lfs-key.outputs.hash }}

      - name: Descargar solo los videos LFS necesarios
        run: git lfs pull --include="$LFS_INCLUDE"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs_markdowns/portal/pnpm-lock.yaml

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Construir artefacto autosuficiente
        working-directory: docs_markdowns/portal
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build

      - name: Excluir video no usado y verificar artefacto
        run: |
          rm -f docs/videos/ejes_invertidos_2026-09-08.mp4
          fallo=0
          IFS=',' read -ra requeridos <<< "$LFS_INCLUDE"
          for ruta in "${requeridos[@]}"; do
            archivo="docs/videos/$(basename "$ruta")"
            if [ ! -f "$archivo" ]; then
              echo "::error::Falta el video requerido: $archivo"
              fallo=1
            fi
          done
          while IFS= read -r -d '' archivo; do
            if head -c 64 "$archivo" | grep -aq '^version https://git-lfs'; then
              echo "::error::Puntero LFS sin resolver: $archivo"
              fallo=1
            fi
          done < <(find docs/videos docs/fotogramas -type f -print0 2>/dev/null)
          echo "Videos: $(find docs/videos -type f -name '*.mp4' 2>/dev/null | wc -l)"
          echo "Fotogramas (.jpg/.webp): $(find docs/fotogramas -type f \( -name '*.jpg' -o -name '*.webp' \) 2>/dev/null | wc -l)"
          exit $fallo

      - name: Publicar artefacto de la web documental
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
