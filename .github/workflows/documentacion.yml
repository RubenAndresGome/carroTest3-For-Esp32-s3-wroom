name: Documentación reproducible

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "documentacionCompleta/**"
      - "evidencia/**"
      - "scripts/documentacion/**"
      - "src/**"
      - "include/**"
      - "desktop_app/**"
      - "android_app/**"
      - "DIAGRAMA_SISTEMA_GENERAL.md"
      - ".github/workflows/documentacion.yml"

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/portal/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Universal Ctags
        run: |
          sudo apt-get update
          sudo apt-get install --yes universal-ctags

      - name: Conservar fecha documental versionada
        run: |
          CATALOG_DATE=$(python -c 'import json; print(json.load(open("docs/catalogo_funciones.json", encoding="utf-8"))["generated_at"])')
          echo "CATALOG_GENERATED_AT=$CATALOG_DATE" >> "$GITHUB_ENV"

      - name: Regenerar catálogo y UML
        run: |
          python scripts/documentacion/generar_catalogo.py
          python scripts/documentacion/renderizar_uml.py
          python scripts/documentacion/validar_enlaces.py

      - name: Validar y construir portal
        working-directory: docs/portal
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build

      - name: Exigir artefactos actualizados
        run: git diff --exit-code
